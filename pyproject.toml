[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bayspecdec"
version = "0.1.0"
description = "Bayesian spectral deconvolution with autodiff HMC/NUTS and exchange Monte Carlo (JAX)"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
plots = ["matplotlib"]  # bayspecdec.diagnostics
datagen = ["numba"]  # bayspecdec.spectrum_gen
test = ["pytest", "numba"]
typecheck = ["mypy", "ty", "scipy-stubs", "matplotlib", "numba", "pytest"]
all = ["bayspecdec[plots,datagen,test,typecheck]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bayspecdec = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src/bayspecdec"]

[tool.ty.src]
include = ["src", "tests"]
